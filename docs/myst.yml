version: 1
project:
  title: napari workshops
  authors:
    - name: napari core team
  github: https://github.com/napari/workshops
  error_rules:
    - rule: link-resolves
      severity: ignore
      keys:
        # GH is rather flaky for CI right now, temporary measure
        # https://github.com/jupyter-book/mystmd/issues/2122#issuecomment-4042718629
         - 'https://github.com/**'
         - 'https://forum.image.sc/**'
         # [image.sc] auto-links as http://image.sc (bare domain) and returns 403
         - 'http*://image.sc*'
         - 'http*://ti.to*'
         - 'https://ti.to/**'
  toc:
    - title: Home
      file: home.md
    - title: Intro to napari 🖱️
      children:
        - file: intro-gui/index.md
        - file: intro-gui/setup.md
        - file: intro-gui/block1_welcome.md
        - file: intro-gui/block2_gui.md
        - file: intro-gui/block3_plugins_and_annotation.md
        - file: intro-gui/block4_analysis_wrap_up.md
    - title: Extending napari with code ⌨️
      children:
        - file: extend/index.md
        - file: extend/setup.md
        - file: extend/block1_welcome.md
        - file: extend/block2_metadata_formats_analysis.md
        - file: extend/block3_custom_widgets.md
        - file: extend/block4_make_a_plugin.md
    - title: napari Express 🚀
      children:
        - file: express/index.md
        - file: express/setup.md
        - file: express/00_gui_intro.md
        - file: express/01_python_to_widget.md
        - file: express/02_segmentation_pipeline.md
        - file: express/03_classification_and_3d.md
    - title: Workshop schedule
      file: events.md
    - title: Instructors
      children:
        - file: instructors/organizers.md
        - file: instructors/instructors.md
  # thebe:
  #   binder:
  #     repo: napari/workshops
  #     provider: github
  #     url: https://mybinder.org
  #     ref: main
  # exports:
  #   - format: pdf
  #     template: plain_latex_book
  #     output: exports/napari_workshop.pdf
site:
  options:
    favicon: _resources/workshop-logo-light.ico
    logo: _resources/workshop-logo-light.svg
    logo_dark: _resources/workshop-logo-dark.svg
    folders: true
    # Generated by `pixi run copy-css` from napari-sphinx-theme + _resources/_custom.css
    style: _resources/napari-theme.css
  template: book-theme
  title: napari workshops
