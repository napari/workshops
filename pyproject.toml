[project]
name = "workshops"
dynamic = ["version"]
description = "Hands-on napari training workshops"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "napari team", email = "info@napari.org" }
]
requires-python = ">=3.13"
dependencies = [
    "napari[all]>=0.8.0rc0",
    "napari-metadata>=0.4.0",
]

[dependency-groups]
extend = [
    "scikit-image",
    "magicgui",
    "scipy",
    "xarray",
    "napari-ome-zarr",
    "bioio",
    "bioio-ome-tiff",
    "bioio-ome-zarr",
    "ndevio",
    "jupyterlab",
    "jupyterlab-myst<2.7",  # does not work with current jupyterlab 4.6.1 https://github.com/jupyter-book/jupyterlab-myst/issues/296
    "jupytext",  # needed for executing the .mds
]
express = [
    "scikit-image",
    "magicgui",
    "scipy",
    "jupyterlab",
    "napari-animation",
]
dev = [
    {include-group = "extend"},
    {include-group = "express"},
    "mystmd",
    "jupyter-book>=2",
    "jupyterlab-myst",
    "jupytext",
    "napari-sphinx-theme",
    "prek",
    "ruff",
]

[tool.uv]
package = false

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]

[tool.pixi.tasks]
napari = "napari"

[tool.pixi.feature.extend.tasks]
jupyter-lab = { cmd = "jupyter lab docs/extend" }

[tool.pixi.feature.extend.dependencies]
python = "==3.13"

[tool.pixi.feature.express.tasks]
jupyter-lab = { cmd = "jupyter lab docs/express" }

[tool.pixi.feature.dev.tasks]
_copy-css = "python docs/_scripts/copy_theme_css.py"
_seed-geometry = "python docs/_scripts/seed_napari_geometry.py"
_docs-clean = { cmd = "cd docs && jupyter-book clean -y" }
_docs-build = { cmd = "cd docs && jupyter-book build --html --execute --strict", depends-on = ["_copy-css", "_seed-geometry"] }
docs-live = { cmd = "cd docs && jupyter-book start --execute .", depends-on = ["_docs-clean", "_copy-css", "_seed-geometry"] }

[tool.pixi.environments]
default = { solve-group = "default" }
extend = { features = ["extend"], solve-group = "default" }
express = { features = ["express"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
fix = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # flake8
    "UP",             # pyupgrade
    "I",              # isort
    "N",              # pep8-naming
]
ignore = [
    "E501",           # line too long — handled by formatter
]

[tool.hatch.version]
source = "vcs"
