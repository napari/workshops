# Show a human-readable pixi.lock diff in the workflow run summary
#
# When a pull request modifies pixi.lock, this workflow computes
# the diff between the base branch's lock file and what `pixi update`
# would produce.  The result is written to the workflow run summary
# (visible from the PR's "Checks" tab).
#
# The napari org has write permissions for Actions disabled, so we
# can't post PR comments.  The step summary is the best alternative.

name: Lock file diff

on:
  pull_request:
    paths:
      - pixi.lock

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with full history for base ref)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          locked: false
          run-install: false

      - name: Generate lock diff
        id: diff
        run: |
          set -o pipefail
          if git show "${{ github.event.pull_request.base.sha }}:pixi.lock" > /dev/null 2>&1; then
            cp pixi.lock pr-pixi.lock
            git show "${{ github.event.pull_request.base.sha }}:pixi.lock" > pixi.lock
            pixi update --json --no-install 2>/dev/null | \
              pixi exec pixi-diff-to-markdown \
                --merge-dependencies=split-explicit \
                --hide-tables=auto \
                --change-type-column \
                --package-type-column \
                --create-links-for-packages \
                > lock-diff.md || echo "No changes detected." > lock-diff.md
            cp pr-pixi.lock pixi.lock
          else
            echo "This PR adds \`pixi.lock\` for the first time — no base to diff against." > lock-diff.md
          fi

      - name: Write diff to job summary
        run: |
          {
            echo "## pixi.lock changes"
            echo ""
            cat lock-diff.md
          } >> "$GITHUB_STEP_SUMMARY"
