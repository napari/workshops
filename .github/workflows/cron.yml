# Weekly pixi.lock update with build validation
#
# Runs every Tuesday at 04:00 UTC,
# or manually via workflow_dispatch.
#
#   1. Update pixi.lock with the latest compatible dependencies
#   2. Generate a human-readable diff of what changed
#   3. Build the docs with the updated lock (unfrozen)
#   4. Write results (diff + build status) to the workflow run summary
#
# Ideally this would create a PR on success or an issue on failure,
# but the napari org has write permissions for Actions disabled, so
# the step summary is the best we can do without a PAT.

name: Weekly lock update

on:
  schedule:
    # Tuesday at 04:00 UTC
    - cron: '0 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          locked: false
          run-install: false

      # ── Step 1: update lock + generate diff ─────────────────────
      - name: Update pixi.lock and generate diff
        id: update
        continue-on-error: true
        run: |
          set -o pipefail
          pixi update --json --no-install 2>&1 | \
            pixi exec pixi-diff-to-markdown \
              --merge-dependencies=split-explicit \
              --hide-tables=auto \
              --change-type-column \
              --package-type-column \
              --create-links-for-packages \
              > diff.md 2>&1 || echo "update_failed=true" >> "$GITHUB_OUTPUT"

      # ── Step 2: build with updated lock ─────────────────────────
      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3
        with:
          qt: true
          wm: herbstluftwm

      - name: Configure herbstluftwm
        run: herbstclient rule title=napari floating=on

      - name: Build docs with updated lock
        id: build
        continue-on-error: true
        run: |
          pixi run build 2>&1 | tee build-output.txt

      # ── Step 3: write results to job summary ───────────────────
      - name: Write results to job summary
        run: |
          {
            echo "# Weekly lock update"
            echo ""
            echo "**Date:** $(date -u)"
            echo "**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""

            if [ "${{ steps.update.outputs.update_failed }}" == "true" ]; then
              echo "## ⚠️ Docs build failed"
              echo ""
              echo "The weekly \`pixi update\` failed on docs build."
            else
              echo "## Lock diff"
              echo ""
              cat diff.md 2>/dev/null || echo "No diff available"
              echo ""

              BUILD_STATUS="${{ steps.build.outcome }}"
              if [ "$BUILD_STATUS" == "success" ]; then
                echo "## ✅ Build succeeded"
              else
                echo "## ❌ Build failed"
                echo ""
                echo '```'
                cat build-output.txt 2>/dev/null || echo "No build output"
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
