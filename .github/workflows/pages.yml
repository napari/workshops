# Build docs on PR/push, deploy to GitHub Pages on main
#
# On pull requests and pushes to main, this workflow builds the workshop
# site using the committed pixi.lock (reproducible builds).  On main it
# also deploys to GitHub Pages.
#
# Lock-file updates are handled by update-lock-weekly.yml — this workflow
# does not run on a schedule.

name: Build and Deploy Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # Since your site lives at `https://{user/org}.github.io/workshops`, set `BASE_URL=/workshops`.
  BASE_URL: /${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          locked: true

      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3
        with:
          qt: true
          wm: herbstluftwm

      - name: Configure herbstluftwm
        # Float napari windows outside the tiling grid so parallel notebook
        # execution doesn't cause herbstluftwm to re-tile and shrink them.
        run: herbstclient rule title=napari floating=on

      - name: Build workshop
        run: pixi run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './docs/_build/html'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
